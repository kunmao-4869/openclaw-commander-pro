<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能工作流管理系统 - Web 界面</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      margin-bottom: 20px;
    }

    .header h1 {
      color: #667eea;
      font-size: 32px;
      margin-bottom: 10px;
    }

    .header p {
      color: #666;
      font-size: 16px;
    }

    .main-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .card h2 {
      color: #333;
      font-size: 24px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card h2 .icon {
      font-size: 28px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      color: #555;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: #667eea;
    }

    .form-group textarea {
      min-height: 100px;
      resize: vertical;
    }

    .btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      width: 100%;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }

    .btn-secondary:hover {
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    .status-panel {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
    }

    .status-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .status-item:last-child {
      border-bottom: none;
    }

    .status-label {
      color: #666;
      font-weight: 500;
    }

    .status-value {
      color: #333;
      font-weight: 600;
    }

    .status-value.success {
      color: #28a745;
    }

    .status-value.warning {
      color: #ffc107;
    }

    .log-panel {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 20px;
      border-radius: 10px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      max-height: 400px;
      overflow-y: auto;
    }

    .log-entry {
      margin-bottom: 8px;
      padding: 8px;
      border-radius: 4px;
    }

    .log-entry.info {
      background: rgba(102, 126, 234, 0.1);
      color: #667eea;
    }

    .log-entry.success {
      background: rgba(40, 167, 69, 0.1);
      color: #28a745;
    }

    .log-entry.error {
      background: rgba(220, 53, 69, 0.1);
      color: #dc3545;
    }

    .log-entry.warning {
      background: rgba(255, 193, 7, 0.1);
      color: #ffc107;
    }

    .quick-actions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .quick-action-btn {
      background: #f8f9fa;
      border: 2px solid #e0e0e0;
      padding: 15px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
      text-align: left;
    }

    .quick-action-btn:hover {
      background: #667eea;
      color: white;
      border-color: #667eea;
      transform: translateY(-2px);
    }

    .quick-action-btn strong {
      display: block;
      margin-bottom: 5px;
    }

    .quick-action-btn small {
      font-size: 12px;
      opacity: 0.8;
    }

    .folder-tree {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.8;
    }

    .folder-tree .folder {
      color: #667eea;
      font-weight: 600;
    }

    .folder-tree .file {
      color: #28a745;
    }

    @media (max-width: 768px) {
      .main-content {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 头部 -->
    <div class="header">
      <h1>🚀 智能工作流管理系统</h1>
      <p>智能项目创建、学习文档管理、代码检索一体化平台</p>
    </div>

    <!-- 主要内容 -->
    <div class="main-content">
      <!-- 左侧：项目创建 -->
      <div class="card">
        <h2><span class="icon">🏗️</span> 创建项目</h2>
        
        <div class="form-group">
          <label for="projectName">项目名称</label>
          <input type="text" id="projectName" placeholder="例如：HarmonyOS_Demo" />
        </div>

        <div class="form-group">
          <label for="projectType">项目类型</label>
          <select id="projectType">
            <option value="harmonyos">HarmonyOS 应用</option>
            <option value="unreal">Unreal Engine 游戏</option>
            <option value="python">Python 应用</option>
            <option value="react">React Web 应用</option>
            <option value="custom">自定义项目</option>
          </select>
        </div>

        <div class="form-group">
          <label for="requirement">项目需求描述</label>
          <textarea id="requirement" placeholder="描述你的项目需求..."></textarea>
        </div>

        <button class="btn" onclick="createProject()">创建智能工作流项目</button>

        <div class="status-panel" id="projectStatus" style="display: none;">
          <h3 style="margin-bottom: 15px;">📊 项目状态</h3>
          <div class="status-item">
            <span class="status-label">项目名称:</span>
            <span class="status-value" id="statusName">-</span>
          </div>
          <div class="status-item">
            <span class="status-label">项目类型:</span>
            <span class="status-value" id="statusType">-</span>
          </div>
          <div class="status-item">
            <span class="status-label">根目录:</span>
            <span class="status-value" id="statusRoot">-</span>
          </div>
          <div class="status-item">
            <span class="status-label">文件夹结构:</span>
            <div class="folder-tree" id="statusStructure"></div>
          </div>
        </div>
      </div>

      <!-- 右侧：学习管理 -->
      <div class="card">
        <h2><span class="icon">📚</span> 学习管理</h2>

        <div class="form-group">
          <label for="learnUrl">学习网页 URL</label>
          <input type="text" id="learnUrl" placeholder="https://developer.harmonyos.com" />
        </div>

        <div class="form-group">
          <label for="searchQuery">检索学习代码</label>
          <input type="text" id="searchQuery" placeholder="搜索关键词，例如：ArkTS" />
        </div>

        <button class="btn" onclick="saveLearningDoc()">学习并保存到 studying</button>
        <button class="btn btn-secondary" onclick="searchStudyingCode()" style="margin-top: 10px;">
          🔍 检索 studying 代码
        </button>
        <button class="btn btn-secondary" onclick="checkImgResources()" style="margin-top: 10px;">
          🖼️ 检查图片资源
        </button>

        <div class="quick-actions">
          <div class="quick-action-btn" onclick="quickAction('harmonyos')">
            <strong>📱 HarmonyOS 项目</strong>
            <small>创建鸿蒙应用开发项目</small>
          </div>
          <div class="quick-action-btn" onclick="quickAction('unreal')">
            <strong>🎮 Unreal 游戏</strong>
            <small>创建虚幻引擎游戏项目</small>
          </div>
          <div class="quick-action-btn" onclick="quickAction('python')">
            <strong>🐍 Python 工具</strong>
            <small>创建 Python 应用项目</small>
          </div>
          <div class="quick-action-btn" onclick="quickAction('react')">
            <strong>⚛️ React 应用</strong>
            <small>创建 React 前端项目</small>
          </div>
        </div>
      </div>
    </div>

    <!-- 日志面板 -->
    <div class="card">
      <h2><span class="icon">📝</span> 操作日志</h2>
      <div class="log-panel" id="logPanel">
        <div class="log-entry info">系统已就绪，等待操作...</div>
      </div>
    </div>
  </div>

  <script>
    // 模拟工作流管理器（实际使用时替换为真实 API 调用）
    class WebWorkflowManager {
      constructor() {
        this.currentProject = null;
      }

      async createProject(name, type, requirement) {
        // 模拟 API 调用
        return new Promise((resolve) => {
          setTimeout(() => {
            this.currentProject = {
              name: name,
              type: type,
              rootDir: `./projects/${type}/${name}`,
              structure: {
                studying: 'studying/',
                project: 'project/',
                img: 'img/',
                docs: 'docs/'
              }
            };
            resolve(this.currentProject);
          }, 1000);
        });
      }

      async saveLearningDoc(url) {
        return new Promise((resolve) => {
          setTimeout(() => {
            resolve({
              success: true,
              docName: `doc_${Date.now()}.md`,
              docPath: `${this.currentProject.rootDir}/studying/doc_${Date.now()}.md`,
              codeBlocks: 3
            });
          }, 1500);
        });
      }

      async searchStudyingCode(query) {
        return new Promise((resolve) => {
          setTimeout(() => {
            resolve({
              total: 2,
              results: [
                { file: 'doc_1234567890.md', preview: '示例代码预览...' },
                { file: 'doc_0987654321.md', preview: '另一个相关文档...' }
              ]
            });
          }, 800);
        });
      }

      async checkImgResources() {
        return new Promise((resolve) => {
          setTimeout(() => {
            resolve({
              imgDir: `${this.currentProject.rootDir}/img`,
              totalImages: 0,
              hasConfig: true
            });
          }, 500);
        });
      }
    }

    // 全局实例
    const workflowManager = new WebWorkflowManager();

    // 日志函数
    function addLog(message, type = 'info') {
      const logPanel = document.getElementById('logPanel');
      const logEntry = document.createElement('div');
      logEntry.className = `log-entry ${type}`;
      logEntry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      logPanel.appendChild(logEntry);
      logPanel.scrollTop = logPanel.scrollHeight;
    }

    // 创建项目
    async function createProject() {
      const name = document.getElementById('projectName').value;
      const type = document.getElementById('projectType').value;
      const requirement = document.getElementById('requirement').value;

      if (!name) {
        addLog('请输入项目名称', 'error');
        return;
      }

      addLog(`正在创建 ${type} 项目：${name}...`, 'info');

      try {
        const project = await workflowManager.createProject(name, type, requirement || 'Web 界面创建');
        
        addLog(`✅ 项目创建成功！`, 'success');
        addLog(`📂 根目录：${project.rootDir}`, 'success');
        
        // 显示项目状态
        document.getElementById('statusName').textContent = project.name;
        document.getElementById('statusType').textContent = project.type;
        document.getElementById('statusRoot').textContent = project.rootDir;
        
        const structureHtml = Object.entries(project.structure)
          .map(([key, value]) => `📁 ${key}: ${value}`)
          .join('<br>');
        document.getElementById('statusStructure').innerHTML = structureHtml;
        
        document.getElementById('projectStatus').style.display = 'block';
        
      } catch (error) {
        addLog(`❌ 创建失败：${error.message}`, 'error');
      }
    }

    // 保存学习文档
    async function saveLearningDoc() {
      const url = document.getElementById('learnUrl').value;

      if (!url) {
        addLog('请输入学习网页 URL', 'error');
        return;
      }

      if (!workflowManager.currentProject) {
        addLog('请先创建项目', 'warning');
        return;
      }

      addLog(`正在学习：${url}...`, 'info');

      try {
        const result = await workflowManager.saveLearningDoc(url);
        addLog(`✅ 学习文档已保存：${result.docName}`, 'success');
        addLog(`📄 提取代码块：${result.codeBlocks} 个`, 'success');
      } catch (error) {
        addLog(`❌ 保存失败：${error.message}`, 'error');
      }
    }

    // 检索代码
    async function searchStudyingCode() {
      const query = document.getElementById('searchQuery').value;

      if (!query) {
        addLog('请输入搜索关键词', 'error');
        return;
      }

      if (!workflowManager.currentProject) {
        addLog('请先创建项目', 'warning');
        return;
      }

      addLog(`正在搜索：${query}...`, 'info');

      try {
        const result = await workflowManager.searchStudyingCode(query);
        addLog(`✅ 找到 ${result.total} 个相关文档`, 'success');
        result.results.forEach((file, i) => {
          addLog(`  ${i + 1}. ${file.file} - ${file.preview}`, 'info');
        });
      } catch (error) {
        addLog(`❌ 搜索失败：${error.message}`, 'error');
      }
    }

    // 检查图片资源
    async function checkImgResources() {
      if (!workflowManager.currentProject) {
        addLog('请先创建项目', 'warning');
        return;
      }

      addLog('正在检查图片资源...', 'info');

      try {
        const result = await workflowManager.checkImgResources();
        addLog(`✅ 图片文件夹：${result.imgDir}`, 'success');
        addLog(`📊 图片数量：${result.totalImages}`, 'info');
        addLog(`📝 配置文件：${result.hasConfig ? '✅ 已生成' : '❌ 未生成'}`, 'info');
      } catch (error) {
        addLog(`❌ 检查失败：${error.message}`, 'error');
      }
    }

    // 快速操作
    function quickAction(type) {
      const typeNames = {
        harmonyos: 'HarmonyOS_Demo',
        unreal: 'UE_Game',
        python: 'Python_Tool',
        react: 'React_App'
      };

      document.getElementById('projectName').value = typeNames[type];
      document.getElementById('projectType').value = type;
      document.getElementById('requirement').value = `创建一个${type}项目`;
      
      addLog(`已选择快速创建 ${type} 项目`, 'info');
    }

    // 初始化
    addLog('🚀 智能工作流管理系统 Web 界面已加载', 'success');
    addLog('💡 提示：创建项目后即可使用学习管理功能', 'info');
  </script>
</body>
</html>
