<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Tailwind 测试</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            dark: {
              900: '#0f172a',
              800: '#1e293b',
              700: '#334155',
            },
            primary: {
              600: '#0284c7',
              400: '#38bdf8',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-dark-900 text-white min-h-screen p-10">
  <h1 class="text-4xl font-bold mb-4">Tailwind CSS 测试</h1>
  <div class="bg-dark-800 p-6 rounded-lg border border-dark-700">
    <p class="mb-4">如果看到彩色背景，说明 Tailwind 工作正常</p>
    <button class="px-6 py-3 bg-primary-600 hover:bg-primary-700 rounded-lg">
      测试按钮
    </button>
  </div>
</body>
</html>
